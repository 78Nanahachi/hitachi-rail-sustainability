<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitachi Rail Sustainability Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* グローバル・プレミアムデザイン設定（コンサルタント仕様） */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1400px;
            background-color: #111827;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            padding: 45px;
            border: 1px solid #1f2937;
            position: relative;
        }

        /* 日立レッドのトップライン */
        .dashboard-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background-color: #e10012;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 30px;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 42px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 16px;
            margin-top: 8px;
            font-weight: 400;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 35px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #1f2937;
        }

        .section-header i {
            color: #e10012;
            font-size: 24px;
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
        }

        /* 地図エリアの洗練 */
        .map-wrapper {
            background: #1f2937;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid #374151;
            margin-bottom: 30px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        #map {
            width: 100%;
            height: 500px;
            border-radius: 8px;
            z-index: 1;
        }

        /* テーブルの大幅修正：絶対にズレず、はみ出さないプロ仕様 */
        .table-wrapper {
            overflow-x: auto;
            background: #1f2937;
            border-radius: 12px;
            border: 1px solid #374151;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #111827;
            color: #ffffff;
            font-weight: 600;
            padding: 16px 20px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 3px solid #e10012;
            white-space: nowrap;
        }

        td {
            padding: 16px 20px;
            border-bottom: 1px solid #374151;
            font-size: 14px;
            color: #d1d5db;
            line-height: 1.6;
            vertical-align: top;
            max-width: 450px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(225, 0, 18, 0.04);
            color: #ffffff;
        }

        /* 地図ポップアップの文字崩れ防止 */
        .leaflet-popup-content-wrapper {
            background: #111827 !important;
            color: #ffffff !important;
            border: 1px solid #374151;
            border-radius: 8px;
        }
        .leaflet-popup-tip { background: #111827 !important; }
        .popup-title { font-family: 'Poppins', sans-serif; font-size: 15px; font-weight: 600; color: #e10012; margin-bottom: 5px; }
        .popup-desc { font-size: 13px; color: #d1d5db; line-height: 1.4; }

        .loading-status {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
            font-style: italic;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header>
        <h1>Hitachi Rail Sustainability Performance</h1>
        <div class="subtitle">Global Operations Tracking & ESG Performance Dashboard</div>
    </header>

    <div class="section-header">
        <i class="fas fa-globe-americas"></i>
        <div class="section-title">Global Sites Map</div>
    </div>
    <div class="map-wrapper">
        <div id="map"></div>
    </div>

    <div class="section-header">
        <i class="fas fa-table"></i>
        <div class="section-title">Operational Sites Performance Details</div>
    </div>
    <div class="table-wrapper" id="tableContainer">
        <div class="loading-status"><i class="fas fa-spinner fa-spin" style="margin-right: 10px; color:#e10012;"></i>スプレッドシートからデータを取得し、最適化されたレイアウトを構築中...</div>
    </div>
</div>

<script>
    // 1. 地図の初期設定（世界の中心に配置）
    const map = L.map('map').setView([30, 10], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 2. スプレッドシート情報
    const sheetId = '1egrUSBZukDLOg95TLYMCLkIbi0bfc78wlWDQ9lOylT4';
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=Sites`;

    // 3. 主要拠点の緯度経度を完全に固定（場所のズレ、間違いを100%防ぐマスターデータ）
    const fixedCoordinates = {
        "笠戸事業所": { lat: 34.0044, lng: 131.8681 },
        "kasado": { lat: 34.0044, lng: 131.8681 },
        "hagerstown": { lat: 39.6418, lng: -77.7200 },
        "ヘイガーズタウン": { lat: 39.6418, lng: -77.7200 },
        "tito scalo": { lat: 40.6122, lng: 15.7428 },
        "ティト・スカーロ": { lat: 40.6122, lng: 15.7428 },
        "naples": { lat: 40.8518, lng: 14.2681 },
        "ナポリ": { lat: 40.8518, lng: 14.2681 },
        "reggio calabria": { lat: 38.1144, lng: 15.6500 },
        "レッジョ・カラブリア": { lat: 38.1144, lng: 15.6500 },
        "ピストイア": { lat: 43.9312, lng: 10.9166 },
        "pistoia": { lat: 43.9312, lng: 10.9166 }
    };

    // 4. 高度なCSV解析エンジン（カンマや改行、ダブルクォーテーションを正しく判別してズレを完全に防ぐ）
    function parseCSV(text) {
        const result = [];
        const regex = /(?:\"([^\"]*(?:\"\"[^\"]*)*)\"|([^,\r\n\"]*))(,|\r?\n|\r)/g;
        let row = [];
        let matches = null;

        if (text.search(/[\r\n]/) === -1) text += "\n";

        while (matches = regex.exec(text)) {
            let match = matches[1] !== undefined ? matches[1].replace(/\"\"/g, '"') : matches[2];
            row.push(match.trim());
            
            let separator = matches[3];
            if (separator !== ',') {
                result.push(row);
                row = [];
            }
        }
        return result;
    }

    // 5. 住所自動検索（マスターデータにない場合のバックアップシステム）
    async function fetchBackupCoordinates(name) {
        try {
            // 無料APIの制限を回避するため、検索前に1秒待機
            await new Promise(r => setTimeout(r, 1000));
            const cleanName = name.replace(/^\d+[\.\s、]*/, ''); // 先頭の「1. 」などを消去
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cleanName)}&limit=1`);
            const data = await response.json();
            if (data && data.length > 0) {
                return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
            }
        } catch (e) { console.error(e); }
        return null;
    }

    // 6. メイン処理：スプレッドシート読み込み・画面生成
    async function initializeDashboard() {
        try {
            const response = await fetch(csvUrl);
            if (!response.ok) throw new Error("シートの取得に失敗しました");
            const text = await response.text();
            
            const parsedData = parseCSV(text);
            if (parsedData.length === 0) return;

            const headers = parsedData[0];
            const rows = parsedData.slice(1);

            // スプレッドシートの「拠点名」と「サステナビリティの取り組み内容」の列位置を自動検出
            const headersLower = headers.map(h => h.toLowerCase());
            const nameIdx = headersLower.findIndex(h => h.includes('name') || h.includes('拠点') || h.includes('名前'));
            const descIdx = headersLower.findIndex(h => h.includes('desc') || h.includes('実績') || h.includes('内容') || h.includes('取り組み') || h.includes('パフォーマンス'));

            const finalNameIdx = nameIdx !== -1 ? nameIdx : 0;
            const finalDescIdx = descIdx !== -1 ? descIdx : headers.length - 1;

            // --- テーブルのHTMLを組み立て ---
            let tableHtml = `<table><thead><tr>`;
            headers.forEach(h => { tableHtml += `<th>${h}</th>`; });
            tableHtml += `</tr></thead><tbody>`;

            // 各行のデータを処理
            for (const row of rows) {
                if (row.length === 0 || !row[finalNameIdx]) continue;

                tableHtml += `<tr>`;
                row.forEach(cell => {
                    tableHtml += `<td>${cell}</td>`;
                });
                tableHtml += `</tr>`;

                // --- マップに正しいピンを立てる処理 ---
                const siteName = row[finalNameIdx];
                const siteDesc = row[finalDescIdx] || "サステナビリティ活動実施拠点";
                
                // まずはマスターデータ（固定座標）から場所を探す
                let coords = null;
                const lookupKey = siteName.toLowerCase();
                
                // 部分一致でも見つけられるように判定（例:「1. 笠戸事業所」でも「笠戸事業所」をヒットさせる）
                const matchedKey = Object.keys(fixedCoordinates).find(key => lookupKey.includes(key));
                
                if (matchedKey) {
                    coords = fixedCoordinates[matchedKey];
                } else {
                    // 固定データにない場合は自動判別を実行
                    coords = await fetchBackupCoordinates(siteName);
                }

                if (coords) {
                    const marker = L.marker([coords.lat, coords.lng]).addTo(map);
                    const popupContent = `
                        <div class="popup-title">${siteName}</div>
                        <div class="popup-desc">${siteDesc}</div>
                    `;
                    marker.bindPopup(popupContent);
                    marker.on('mouseover', function() { this.openPopup(); });
                }
            }

            tableHtml += `</tbody></table>`;
            document.getElementById('tableContainer').innerHTML = tableHtml;

        } catch (error) {
            console.error(error);
            document.getElementById('tableContainer').innerHTML = `
                <div class="loading-status" style="color: #ef4444;">
                    <i class="fas fa-exclamation-triangle" style="margin-right:10px;"></i>
                    エラー：スプレッドシートデータの読み込み、または解析に失敗しました。公開設定を確認してください。
                </div>`;
        }

        // 地図の表示乱れを防ぐための強制再描画
        setTimeout(() => { map.invalidateSize(); }, 400);
    }

    window.onload = initializeDashboard;
</script>

</body>
</html>
