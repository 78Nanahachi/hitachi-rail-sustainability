<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitachi Rail Sustainability Performance Dashboard</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* グローバル・プレミアムデザイン設定 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 1600px;
            background-color: #111827;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            padding: 40px;
            border: 1px solid #1f2937;
            position: relative;
        }

        /* 日立レッドのトップライン */
        .dashboard-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 6px;
            background-color: #e10012;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        header {
            margin-bottom: 30px;
            border-bottom: 1px solid #1f2937;
            padding-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 4px;
        }

        .header-tag {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #e10012;
            font-weight: 700;
        }

        /* 3カラム・コックピットレイアウト */
        .main-grid {
            display: grid;
            grid-template-columns: 420px 540px 1fr;
            gap: 30px;
            align-items: start;
        }

        /* 各種コンポーネントカード */
        .card {
            background-color: #1f2937;
            border-radius: 12px;
            border: 1px solid #374151;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #e10012;
            padding-left: 10px;
        }

        /* 左カラム：グラフエリア */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .chart-wrapper {
            position: relative;
            height: 220px;
            width: 100%;
        }

        /* 中央カラム：テーブルエリア（はみ出さず、絶対にズレない） */
        .table-wrapper {
            width: 100%;
            height: 560px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #111827;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #111827;
            color: #ffffff;
            font-weight: 600;
            padding: 12px 16px;
            font-size: 12px;
            text-transform: uppercase;
            border-bottom: 2px solid #e10012;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #374151;
            font-size: 12px;
            color: #d1d5db;
            line-height: 1.5;
            vertical-align: top;
        }

        tr:hover td {
            background-color: rgba(225, 0, 18, 0.05);
            color: #ffffff;
        }

        /* 右カラム：地図エリア */
        #map {
            width: 100%;
            height: 560px;
            border-radius: 12px;
            border: 1px solid #374151;
            z-index: 1;
        }

        /* 地図ポップアップの洗練 */
        .leaflet-popup-content-wrapper {
            background: #111827 !important;
            color: #ffffff !important;
            border: 1px solid #374151;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .leaflet-popup-tip { background: #111827 !important; }
        .popup-title { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; color: #e10012; margin-bottom: 4px; }
        .popup-desc { font-size: 12px; color: #cbd5e1; line-height: 1.4; }

        .loading-status {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header>
        <div>
            <div class="header-tag">Confidential Strategic Report</div>
            <h1>Hitachi Rail Sustainability Performance</h1>
            <div class="subtitle">Data Integration Platform (FY2021 - FY2025)</div>
        </div>
        <div style="color: #9ca3af; font-size: 12px; font-family: 'Poppins';">Data Status: Live Sync</div>
    </header>

    <div class="main-grid">
        <div class="left-column">
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-line"></i> CO2 Emissions Trend (Scope 1 & 2)</div>
                <div class="chart-wrapper">
                    <canvas id="co2LineChart"></canvas>
                </div>
            </div>
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-pie"></i> Global Energy Mix Profile</div>
                <div class="chart-wrapper" style="height: 200px;">
                    <canvas id="energyPieChart"></canvas>
                </div>
            </div>
        </div>

        <div class="card" style="padding: 20px;">
            <div class="card-title"><i class="fas fa-list-alt"></i> Operational Sites Audit</div>
            <div class="table-wrapper" id="tableContainer">
                <div class="loading-status"><i class="fas fa-circle-notch fa-spin" style="color:#e10012; margin-right:8px;"></i>スプレッドシートからデータを完全同期中...</div>
            </div>
        </div>

        <div>
            <div id="map"></div>
        </div>
    </div>
</div>

<script>
    // 地図の初期セット（グローバルビュー）
    const map = L.map('map').setView([25, 10], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // スプレッドシート直結設定
    const sheetId = '1egrUSBZukDLOg95TLYMCLkIbi0bfc78wlWDQ9lOylT4';
    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=Sites`;

    // 鉄道主要拠点の精密緯度経度マスター（AIの誤判定を完全に修正）
    const fixedCoordinates = {
        "笠戸事業所": { lat: 34.0044, lng: 131.8681 },
        "kasado": { lat: 34.0044, lng: 131.8681 },
        "hagerstown": { lat: 39.6418, lng: -77.7200 },
        "ヘイガーズタウン": { lat: 39.6418, lng: -77.7200 },
        "tito scalo": { lat: 40.6122, lng: 15.7428 },
        "ティト・スカーロ": { lat: 40.6122, lng: 15.7428 },
        "naples": { lat: 40.8518, lng: 14.2681 },
        "ナポリ": { lat: 40.8518, lng: 14.2681 },
        "reggio calabria": { lat: 38.1144, lng: 15.6500 },
        "レッジョ・カラブリア": { lat: 38.1144, lng: 15.6500 },
        "ピストイア": { lat: 43.9312, lng: 10.9166 },
        "pistoia": { lat: 43.9312, lng: 10.9166 }
    };

    // 高度なCSVパースエンジン（カンマ・改行ずれを完全に防御）
    function parseCSV(text) {
        const result = [];
        const regex = /(?:\"([^\"]*(?:\"\"[^\"]*)*)\"|([^,\r\n\"]*))(,|\r?\n|\r)/g;
        let row = [];
        let matches = null;
        if (text.search(/[\r\n]/) === -1) text += "\n";
        while (matches = regex.exec(text)) {
            let match = matches[1] !== undefined ? matches[1].replace(/\"\"/g, '"') : matches[2];
            row.push(match.trim());
            if (matches[3] !== ',') {
                result.push(row);
                row = [];
            }
        }
        return result;
    }

    // バックアップ用自動検索
    async function fetchBackupCoords(name) {
        try {
            await new Promise(r => setTimeout(r, 1000));
            const cleanName = name.replace(/^\d+[\.\s、]*/, '');
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cleanName)}&limit=1`);
            const data = await response.json();
            if (data && data.length > 0) return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        } catch (e) { console.error(e); }
        return null;
    }

    // ダッシュボード初期化
    async function initDashboard() {
        try {
            const response = await fetch(csvUrl);
            const text = await response.text();
            const parsedData = parseCSV(text);
            if (parsedData.length === 0) return;

            const headers = parsedData[0];
            const rows = parsedData.slice(1);

            const headersLower = headers.map(h => h.toLowerCase());
            const nameIdx = headersLower.findIndex(h => h.includes('name') || h.includes('拠点') || h.includes('名前'));
            const descIdx = headersLower.findIndex(h => h.includes('desc') || h.includes('実績') || h.includes('内容') || h.includes('取り組み'));

            const finalNameIdx = nameIdx !== -1 ? nameIdx : 0;
            const finalDescIdx = descIdx !== -1 ? descIdx : headers.length - 1;

            // テーブル構築
            let tableHtml = `<table><thead><tr>`;
            headers.forEach(h => { tableHtml += `<th>${h}</th>`; });
            tableHtml += `</tr></thead><tbody>`;

            for (const row of rows) {
                if (row.length === 0 || !row[finalNameIdx]) continue;

                tableHtml += `<tr>`;
                row.forEach(cell => { tableHtml += `<td>${cell}</td>`; });
                tableHtml += `</tr>`;

                // マップへのマッピング
                const siteName = row[finalNameIdx];
                const siteDesc = row[finalDescIdx] || "";
                
                let coords = null;
                const lookupKey = siteName.toLowerCase();
                const matchedKey = Object.keys(fixedCoordinates).find(key => lookupKey.includes(key));
                
                if (matchedKey) {
                    coords = fixedCoordinates[matchedKey];
                } else {
                    coords = await fetchBackupCoords(siteName);
                }

                if (coords) {
                    const marker = L.marker([coords.lat, coords.lng]).addTo(map);
                    marker.bindPopup(`<div class="popup-title">${siteName}</div><div class="popup-desc">${siteDesc}</div>`);
                    marker.on('mouseover', function() { this.openPopup(); });
                }
            }
            tableHtml += `</tbody></table>`;
            document.getElementById('tableContainer').innerHTML = tableHtml;

        } catch (e) {
            document.getElementById('tableContainer').innerHTML = `<div class="loading-status" style="color:#ef4444;">データの読み込みに失敗しました。</div>`;
        }

        // プロフェッショナルグラフの描画（Chart.jsエンジン）
        renderProfessionalCharts();

        setTimeout(() => { map.invalidateSize(); }, 400);
    }

    function renderProfessionalCharts() {
        // グラフ1: CO2折れ線グラフ
        const ctxLine = document.getElementById('co2LineChart').getContext('2d');
        new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: ['FY21', 'FY22', 'FY23', 'FY24(P)'],
                datasets: [{
                    label: 'Scope 1 & 2 (t-CO2e)',
                    data: [45046, 38200, 35046, 29000],
                    borderColor: '#e10012',
                    backgroundColor: 'rgba(225, 0, 18, 0.15)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.3,
                    pointBackgroundColor: '#ffffff',
                    pointBorderColor: '#e10012',
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af' } },
                    y: { grid: { color: '#1f2937' }, ticks: { color: '#9ca3af' } }
                }
            }
        });

        // グラフ2: エネルギー構成ドーナツグラフ
        const ctxPie = document.getElementById('energyPieChart').getContext('2d');
        new Chart(ctxPie, {
            type: 'doughnut',
            data: {
                labels: ['再エネ電力', 'その他電力/燃料'],
                datasets: [{
                    data: [65, 35],
                    backgroundColor: ['#e10012', '#4b5563'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: { color: '#d1d5db', font: { size: 12 } }
                    }
                },
                cutout: '70%'
            }
        });
    }

    window.onload = initDashboard;
</script>

</body>
</html>
